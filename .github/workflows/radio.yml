name: Radio software
on:
  push:
    branches: [main]
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Galinsky-Arts/Distributed-Audio-Engine
          ref: feaf485beb25f25ce222b3bc7a57c09392cc57a6
          path: .deps/audio-core
          persist-credentials: false
      - run: npm ci --ignore-scripts
        working-directory: .deps/audio-core
      - run: npm run build
        working-directory: .deps/audio-core
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: python3 scripts/check-current-secrets.py
      - run: npm run check
        env:
          AUDIO_ENGINE_MODULE: ${{ github.workspace }}/.deps/audio-core/dist/src/index.js
